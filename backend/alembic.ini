[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# sqlalchemy.url is intentionally left unset here — alembic/env.py reads
# the database URL from the DATABASE_URL environment variable (falling
# back to app.config.Settings) so the same migrations can target either
# the dev or test database without editing this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
